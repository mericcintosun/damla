name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (forge test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Public defaults so the build never depends on secrets. The relayer key is only read at
          # runtime, never at build time.
          NEXT_PUBLIC_CONTRACT: "0x367F9BFc8E0A7270025914Eb5EF457A718bC5aE1"
          NEXT_PUBLIC_DROP_CONTRACT: "0x7d105954B5A597375CFA4b6a5e08fB8e4bfb953d"
          NEXT_PUBLIC_CHAIN_ID: "10143"
          NEXT_PUBLIC_RPC_URL: "https://testnet-rpc.monad.xyz"
          NEXT_PUBLIC_EXPLORER: "https://testnet.monadexplorer.com"
